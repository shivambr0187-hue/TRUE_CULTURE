<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRUE CULTURE | User Profile</title>
    <style>
      :root {
        --bg: #07131d;
        --panel: rgba(16, 28, 39, 0.96);
        --gold: #f2c77d;
        --gold-strong: #d9a85f;
        --gold-soft: #f9ebc4;
        --text: #edf4ff;
        --muted: #bfd0e3;
        --line: rgba(255,255,255,0.09);
        --success: #7fe0b9;
        --danger: #ffb5a0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #07131d 0%, #0d1d2b 100%);
        color: var(--text);
      }
      .dashboard {
        max-width: 1080px;
        margin: 40px auto;
        padding: 20px;
      }
      .topbar, .card {
        background: linear-gradient(180deg, rgba(17,32,46,0.96), rgba(11,20,29,0.96));
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 18px 36px rgba(0,0,0,0.12);
      }
      .topbar {
        padding: 22px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .pill {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(242, 199, 125, 0.12);
        color: var(--gold-soft);
        border: 1px solid rgba(242,199,125,0.18);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .card {
        padding: 24px;
      }
      .big { font-size: clamp(28px, 4vw, 42px); font-weight: 800; letter-spacing: -0.04em; }
      .muted { color: var(--muted); }
      ul { list-style: none; padding: 0; margin: 18px 0 0; }
      li { margin-bottom: 10px; color: var(--muted); }
      .btn {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 18px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--gold), var(--gold-strong));
        color: #0c1a27;
        font-weight: 800;
        text-decoration: none;
      }
      @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <div class="topbar">
        <div>
          <div class="pill">User Portal</div>
          <h1 id="welcomeText" style="margin:14px 0 0; font-size: clamp(28px, 4vw, 42px);">Welcome back</h1>
        </div>
        <a class="btn" href="/">Back to Home</a>
      </div>

      <div class="grid">
        <div class="card">
          <div class="muted">Profile Summary</div>
          <div class="big" id="userName">Guest User</div>
          <ul>
            <li>Role: User</li>
            <li>Membership: Premium Member</li>
            <li>Bookings: 3 active reservations</li>
            <li>Preferred city: Jaipur</li>
          </ul>
        </div>

        <div class="card">
          <div class="muted">Upcoming Stay</div>
          <div class="big">Azure Cove</div>
          <ul>
            <li>Check-in: 14 Jul 2026</li>
            <li>Room: Deluxe Suite</li>
            <li>Payment: Paid in full</li>
            <li>Status: Confirmed</li>
          </ul>
        </div>
      </div>
    </div>

    <script>
      const session = JSON.parse(localStorage.getItem('tcAuthSession') || 'null');
      if (!session || session.role !== 'user') {
        window.location.href = '/admin/login.html?role=user';
      }
      document.getElementById('welcomeText').textContent = 'Welcome back, ' + (session.name || 'Guest');
      document.getElementById('userName').textContent = session.name || 'Guest User';
    </script>
  </body>
</html>
